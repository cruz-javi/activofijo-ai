[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "activofijo-ai"
version = "0.1.0"
description = "Microservicio analítico de Machine Learning, Visión y Orquestación LLM/MCP para UAGRM Activo Fijo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.32.0,<1.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "httpx>=0.27.0,<1.0.0",
  "mcp>=1.2.0,<2.0.0",
  "numpy>=1.26.0,<3.0.0",
  "onnxruntime>=1.19.0,<2.0.0",
  "opencv-python-headless>=4.10.0,<5.0.0",
  "rapidocr-onnxruntime>=1.4.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "ruff>=0.7.0,<1.0.0",
]
ml = [
  "numpy>=2.1.0,<3.0.0",
  "pandas>=2.2.0,<3.0.0",
  "scikit-learn>=1.5.0,<2.0.0",
  "lightgbm>=4.5.0,<5.0.0",
  "joblib>=1.4.0,<2.0.0",
  "onnxruntime>=1.19.0,<2.0.0",
  "pillow>=11.0.0,<12.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/activofijo_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
